<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SH Admin - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>SH Admin 管理系统</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label for="captcha">验证码</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="captcha" name="captcha" required placeholder="请输入验证码"
                            style="flex: 1;" maxlength="4" autocomplete="off">
                        <canvas id="captchaCanvas" width="120" height="40"
                            style="border: 1px solid #ddd; border-radius: 5px; cursor: pointer;"
                            title="点击刷新验证码"></canvas>
                    </div>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-primary">登录</button>
                </div>
            </form>
            <div id="message" class="message"></div>
        </div>
    </div>
    <script src="/static/js/login.js"></script>
</body>
</html>
